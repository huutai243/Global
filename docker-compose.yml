services:
  ecommerce-webapi:
    build:
      context: .
      dockerfile: ECommerce.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ECommerceDatabase: "Server=ecommerce-sqlserver,1433;Database=ECommerce;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      RedisSettings__ConnectionString: "ecommerce-redis:6379"
      RabbitMqSettings__HostName: "ecommerce-rabbitmq"
      KafkaSettings__BootstrapServers: "ecommerce-kafka:9092"
    depends_on:
      - ecommerce-sqlserver
      - ecommerce-redis
      - ecommerce-rabbitmq
      - ecommerce-kafka

  ecommerce-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"

  ecommerce-redis:
    image: redis:7
    ports:
      - "6379:6379"

  ecommerce-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  ecommerce-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  ecommerce-kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "ecommerce-zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://ecommerce-kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - ecommerce-zookeeper
